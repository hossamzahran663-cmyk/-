<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Obsidian System - إعلان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#151719;display:grid;place-items:center;font-family:Tajawal,Arial,sans-serif}.ad{position:relative;width:min(100vw,900px);aspect-ratio:4/5;overflow:hidden;background:#101214;color:#fff}.ad::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,7,8,.97) 0%,rgba(6,7,8,.77) 42%,rgba(6,7,8,.12) 78%,rgba(6,7,8,.4) 100%);z-index:1}.ad::after{content:"";position:absolute;inset:0;border:1px solid rgba(216,219,224,.35);z-index:3;pointer-events:none}.visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.copy{position:absolute;z-index:2;inset:7% auto 7% 7%;width:54%;display:flex;flex-direction:column;align-items:flex-start}.brand{display:flex;align-items:center;gap:12px;font-size:clamp(16px,2.2vw,25px);font-weight:900;color:#d8dbe0}.brand img{width:clamp(42px,5.5vw,68px);height:clamp(42px,5.5vw,68px);border-radius:8px;object-fit:cover}.eyebrow{margin:clamp(40px,7vw,85px) 0 14px;color:#c7cbd1;font-size:clamp(14px,1.65vw,20px);font-weight:800}.copy h1{margin:0;color:#fff;font-size:clamp(36px,5.4vw,70px);line-height:1.18;font-weight:900}.copy h1 em{display:block;color:#d8dbe0;font-style:normal}.copy p{margin:22px 0 26px;max-width:400px;color:#e1e4e8;font-size:clamp(15px,1.8vw,23px);line-height:1.7;font-weight:700}.features{display:grid;gap:10px;margin:0;padding:0;list-style:none;font-size:clamp(13px,1.45vw,18px);font-weight:700}.features li{display:flex;align-items:center;gap:9px}.features i{display:inline-grid;place-items:center;width:21px;height:21px;border:1px solid #aeb4bc;border-radius:50%;font-style:normal;color:#d8dbe0;font-size:13px}.cta{margin-top:auto;border:1px solid #d8dbe0;padding:12px 19px;color:#fff;text-decoration:none;font-size:clamp(14px,1.55vw,19px);font-weight:900;letter-spacing:0;cursor:pointer}.footer{position:absolute;z-index:2;bottom:7%;right:7%;color:#e7e9ec;font-size:clamp(11px,1.2vw,15px);font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg)}@media(max-width:600px){.copy{width:70%;inset:6% auto 6% 7%}.eyebrow{margin-top:16vw}.copy p{margin:16px 0 20px}.features{gap:7px}.cta{padding:9px 13px}}
  </style>
</head>
<body>
  <article class="ad">
    <img class="visual" src="obsidian-ad-background.png" alt="بيئة عمل علاج طبيعي حديثة">
    <section class="copy">
      <div class="brand"><img src="obsidian-system-logo.jpeg" alt="Obsidian System"><span>OBSIDIAN SYSTEM</span></div>
      <p class="eyebrow">برنامج متكامل لمراكز العلاج الطبيعي والتأهيل</p>
      <h1>إدارة أسرع.<em>رعاية أوضح.</em></h1>
      <p>من الاستقبال وحتى شركات التأمين، اجمع عمليات مركزك في نظام واحد مصمم للعمل اليومي.</p>
      <ul class="features"><li><i>✓</i> ملفات المرضى والجلسات</li><li><i>✓</i> الحجوزات والمتابعة</li><li><i>✓</i> التأمين والعقود</li><li><i>✓</i> الحسابات والتقارير</li></ul>
      <a class="cta" href="app.html">ابدأ التجربة</a>
    </section>
    <div class="footer">OBSIDIAN SYSTEM</div>
  </article>
</body>
</html>
